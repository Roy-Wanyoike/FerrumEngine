name: Release

on:
  push:
    branches: [main]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  version:
    name: Version Packages
    runs-on: ubuntu-latest
    outputs:
      published: ${{ steps.changeset.outputs.published }}
      publishedPackages: ${{ steps.changeset.outputs.publishedPackages }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          registry-url: https://registry.npmjs.org/
      - run: pnpm install --frozen-lockfile
      - name: Create Release Pull Request or Publish
        id: changeset
        uses: changesets/action@v1
        with:
          title: chore: version packages
          commit: chore: version packages
          publish: pnpm release
          version: pnpm version
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  publish:
    name: Publish Packages
    runs-on: ubuntu-latest
    needs: version
    if: needs.version.outputs.published == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          registry-url: https://registry.npmjs.org/
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Publish to npm
        run: pnpm -r publish --access public --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  post-release:
    name: Post-Release Notification
    runs-on: ubuntu-latest
    needs: publish
    if: needs.version.outputs.published == 'true'
    steps:
      - name: Comment published packages
        uses: actions/github-script@v7
        with:
          script: |
            const published = `${{ needs.version.outputs.publishedPackages }}`;
            if (published && published !== 'undefined') {
              const packages = JSON.parse(published);
              const body = packages
                .map((pkg) => `📦 \`${pkg.name}@${pkg.version}\``)
                .join('\n');
              console.log(`Published:\n${body}`);
            }