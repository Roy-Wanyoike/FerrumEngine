name: PR Preview

on:
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: pr-preview-${{ github.event.number }}
  cancel-in-progress: true

jobs:
  build-docs:
    name: Build Docs Preview
    runs-on: ubuntu-latest
    if: github.event.pull_request.head.repo.full_name == github.repository
    outputs:
      deployDir: ${{ steps.meta.outputs.deploy_dir }}
      prNumber: ${{ steps.meta.outputs.pr_number }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Build docs site
        run: pnpm --filter docs build
      - name: Build playground
        run: pnpm --filter playground build
      - name: Set deploy metadata
        id: meta
        run: |
          DEPLOY_DIR="preview-pr-${{ github.event.number }}"
          echo "deploy_dir=${DEPLOY_DIR}" >> "$GITHUB_OUTPUT"
          echo "pr_number=${{ github.event.number }}" >> "$GITHUB_OUTPUT"
      - name: Deploy preview to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy docs/dist --project-name=ferrum-docs --branch=${{ steps.meta.outputs.deploy_dir }}
      - name: Deploy playground preview
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy playground/dist --project-name=ferrum-playground --branch=${{ steps.meta.outputs.deploy_dir }}

  comment-preview:
    name: Comment Preview URL
    runs-on: ubuntu-latest
    needs: build-docs
    if: always() && needs.build-docs.result == 'success'
    steps:
      - name: Post preview comment
        uses: actions/github-script@v7
        with:
          script: |
            const deployDir = `${{ needs.build-docs.outputs.deployDir }}`;
            const prNumber = `${{ needs.build-docs.outputs.prNumber }}`;

            const docsUrl = `https://ferrum-docs.pages.dev/${deployDir}/`;
            const playgroundUrl = `https://ferrum-playground.pages.dev/${deployDir}/`;

            // Find and delete any previous preview comments from this workflow
            const comments = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
            });

            const botComments = comments.data.filter(
              (c) => c.user.type === 'Bot' && c.body?.includes('🧪 PR Preview')
            );

            for (const comment of botComments) {
              await github.rest.issues.deleteComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: comment.id,
              });
            }

            const body = [
              '## 🧪 PR Preview',
              '',
              `| Preview | URL |`,
              `|---------|-----|`,
              `| 📖 Docs | [${docsUrl}](${docsUrl}) |`,
              `| 🎮 Playground | [${playgroundUrl}](${playgroundUrl}) |`,
              '',
              '> ⚠️ Previews are rebuilt on every push to this PR.',
            ].join('\n');

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
              body,
            });