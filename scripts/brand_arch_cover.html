<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=794, initial-scale=1.0">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;0,900;1,400&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 794px; height: 1123px;
    margin: 0; padding: 0;
    overflow: hidden;
    background: #10100e;
    font-family: 'Inter', sans-serif;
    color: #ecebea;
    -webkit-font-smoothing: antialiased;
  }

  .cover {
    position: relative;
    width: 794px; height: 1123px;
    overflow: hidden;
  }

  /* Geometric accent — top-right arc */
  .accent-arc {
    position: absolute;
    top: -120px; right: -80px;
    width: 400px; height: 400px;
    border: 1.5px solid rgba(217, 193, 122, 0.12);
    border-radius: 50%;
  }
  .accent-arc-2 {
    position: absolute;
    top: -60px; right: -20px;
    width: 300px; height: 300px;
    border: 1px solid rgba(217, 193, 122, 0.08);
    border-radius: 50%;
  }

  /* Bottom-left line cluster */
  .line-cluster {
    position: absolute;
    bottom: 80px; left: 60px;
    width: 200px; height: 120px;
  }
  .line-cluster .l1 {
    position: absolute;
    bottom: 0; left: 0;
    width: 120px; height: 1px;
    background: rgba(217, 193, 122, 0.25);
    transform: rotate(-8deg);
    transform-origin: left bottom;
  }
  .line-cluster .l2 {
    position: absolute;
    bottom: 20px; left: 10px;
    width: 80px; height: 1px;
    background: rgba(217, 193, 122, 0.15);
    transform: rotate(-4deg);
    transform-origin: left bottom;
  }
  .line-cluster .l3 {
    position: absolute;
    bottom: 40px; left: 20px;
    width: 50px; height: 1px;
    background: rgba(217, 193, 122, 0.10);
  }

  /* Content zones */
  .zone-top {
    position: absolute;
    top: 14%;
    left: 14%;
    right: 14%;
  }

  .zone-bottom {
    position: absolute;
    bottom: 14%;
    left: 14%;
    right: 14%;
  }

  /* Kicker */
  .kicker {
    font-family: 'Inter', sans-serif;
    font-size: 11px;
    font-weight: 500;
    letter-spacing: 4px;
    text-transform: uppercase;
    color: #8d8b84;
    margin-bottom: 24px;
  }

  /* Title */
  .title {
    font-family: 'Playfair Display', serif;
    font-weight: 900;
    font-size: 52px;
    line-height: 1.08;
    color: #ecebea;
    margin-bottom: 28px;
    letter-spacing: -0.5px;
  }
  .title .gold {
    color: #d9c17a;
  }

  /* Subtitle */
  .subtitle {
    font-family: 'Playfair Display', serif;
    font-style: italic;
    font-weight: 400;
    font-size: 20px;
    line-height: 1.5;
    color: #b6a266;
    max-width: 420px;
  }

  /* Gold rule */
  .gold-rule {
    width: 60px;
    height: 2px;
    background: #d9c17a;
    margin-bottom: 32px;
  }

  /* Meta */
  .meta {
    display: flex;
    gap: 32px;
    font-size: 10px;
    color: #8d8b84;
    letter-spacing: 0.5px;
  }
  .meta-item {
    display: flex;
    flex-direction: column;
    gap: 3px;
  }
  .meta-label {
    font-size: 8px;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    color: #59513b;
  }

  /* Positioning statement */
  .positioning {
    font-family: 'Playfair Display', serif;
    font-style: italic;
    font-size: 14px;
    line-height: 1.6;
    color: rgba(236, 235, 234, 0.6);
    max-width: 380px;
    border-left: 2px solid rgba(217, 193, 122, 0.3);
    padding-left: 16px;
  }
</style>
</head>
<body>
<div class="cover">
  <!-- Geometric accents -->
  <div class="accent-arc"></div>
  <div class="accent-arc-2"></div>
  <div class="line-cluster">
    <div class="l1"></div>
    <div class="l2"></div>
    <div class="l3"></div>
  </div>

  <!-- Top zone: title block -->
  <div class="zone-top">
    <div class="kicker">Foundation Document</div>
    <div class="gold-rule"></div>
    <div class="title">
      Ferrum<br/>
      Brand<br/>
      <span class="gold">Architecture</span>
    </div>
    <div class="subtitle">
      The narrative foundation for<br/>
      the Universal UI Platform.
    </div>
  </div>

  <!-- Bottom zone: meta + positioning -->
  <div class="zone-bottom">
    <div class="positioning">
      Ferrum is the rendering infrastructure for the AI-native web.
    </div>
    <div style="height: 32px;"></div>
    <div class="meta">
      <div class="meta-item">
        <span class="meta-label">Classification</span>
        <span>Confidential</span>
      </div>
      <div class="meta-item">
        <span class="meta-label">Version</span>
        <span>1.0</span>
      </div>
      <div class="meta-item">
        <span class="meta-label">Date</span>
        <span>July 2025</span>
      </div>
    </div>
  </div>
</div>
</body>
</html>
