<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1200px;
    font-family: system-ui, sans-serif;
    background: #ffffff;
    color: #1e293b;
    padding: 40px 50px 50px 50px;
  }

  .diagram-title {
    font-size: 16px;
    font-weight: 700;
    color: #1e293b;
    text-align: center;
    margin-bottom: 50px;
    letter-spacing: 0.02em;
  }

  .graph-container {
    position: relative;
    width: 1100px;
    height: 320px;
    margin: 0 auto;
  }

  .graph-svg {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
  }

  .node {
    position: absolute;
    background: #EFF6FF;
    border: 1.5px solid #93C5FD;
    border-radius: 10px;
    padding: 16px 22px;
    text-align: center;
    min-width: 170px;
  }

  .node.input-node { background: #F0FDF4; border-color: #86EFAC; }
  .node.output-node { background: #F3E8FF; border-color: #C4B5FD; }
  .node.process-node { background: #FEF3C7; border-color: #FCD34D; }

  .node-title {
    font-size: 13px;
    font-weight: 700;
    color: #1e293b;
    margin-bottom: 4px;
  }

  .node-desc {
    font-size: 11px;
    color: #475569;
    line-height: 1.5;
  }

  .node-sub {
    font-size: 11px;
    color: #64748b;
    margin-top: 6px;
    line-height: 1.5;
    font-style: italic;
  }

  .tag {
    display: inline-block;
    font-size: 10px;
    color: #475569;
    background: rgba(0,0,0,0.04);
    border-radius: 4px;
    padding: 2px 7px;
    margin: 2px 2px 0 2px;
  }
</style>
</head>
<body>

<div class="diagram-title">Physics Node Graph</div>

<div class="graph-container">

  <!-- SVG Connectors -->
  <svg class="graph-svg" viewBox="0 0 1100 320">
    <!-- User Scroll -> Spring Physics (curved) -->
    <path d="M 270 70 C 370 70, 370 130, 440 140"
          fill="none" stroke="#94A3B8" stroke-width="1.5"/>
    <polygon points="440,140 432,136 434,144" fill="#94A3B8"/>

    <!-- Gesture Input -> Spring Physics (curved from top) -->
    <path d="M 560 70 C 560 100, 540 110, 540 130"
          fill="none" stroke="#94A3B8" stroke-width="1.5"/>
    <polygon points="540,130 536,122 544,124" fill="#94A3B8"/>

    <!-- Spring Physics -> Easing Function (curved) -->
    <path d="M 560 210 C 620 230, 680 180, 740 160"
          fill="none" stroke="#94A3B8" stroke-width="1.5"/>
    <polygon points="740,160 732,158 734,166" fill="#94A3B8"/>

    <!-- Easing Function -> Natural Movement (curved) -->
    <path d="M 890 160 C 920 160, 930 160, 940 160"
          fill="none" stroke="#94A3B8" stroke-width="1.5"/>
    <polygon points="940,160 932,156 932,164" fill="#94A3B8"/>
  </svg>

  <!-- Node: User Scroll -->
  <div class="node input-node" style="top: 30px; left: 60px;">
    <div class="node-title">User Scroll</div>
    <div class="node-desc">Scroll event input</div>
  </div>

  <!-- Node: Gesture Input -->
  <div class="node input-node" style="top: 30px; left: 460px;">
    <div class="node-title">Gesture Input</div>
    <div class="node-desc">Touch / pointer gesture</div>
  </div>

  <!-- Node: Spring Physics (larger) -->
  <div class="node process-node" style="top: 130px; left: 370px; min-width: 230px; padding: 16px 22px;">
    <div class="node-title">Spring Physics</div>
    <div class="node-desc">Physics simulation engine</div>
    <div class="node-sub">
      <span class="tag">mass</span>
      <span class="tag">velocity</span>
      <span class="tag">friction</span>
      <span class="tag">damping</span>
    </div>
  </div>

  <!-- Node: Easing Function -->
  <div class="node" style="top: 120px; left: 720px;">
    <div class="node-title">Easing Function</div>
    <div class="node-desc">Interpolation and curve mapping</div>
  </div>

  <!-- Node: Natural Movement -->
  <div class="node output-node" style="top: 120px; left: 940px;">
    <div class="node-title">Natural Movement</div>
    <div class="node-desc">Organic animation output</div>
  </div>

</div>

</body>
</html>
