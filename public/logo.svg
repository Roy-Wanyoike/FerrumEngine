<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none">
  <style>
    .fl-speed-1 { animation: fl-pulse-1 2.5s ease-in-out infinite; }
    .fl-speed-2 { animation: fl-pulse-2 3s ease-in-out 0.4s infinite; }
    .fl-speed-3 { animation: fl-pulse-3 2.8s ease-in-out 0.8s infinite; }
    .fl-orbit-1 { animation: fl-spin-cw 40s linear infinite; transform-origin: 64px 64px; }
    .fl-orbit-2 { animation: fl-spin-ccw 30s linear infinite; transform-origin: 64px 64px; }
    @keyframes fl-pulse-1 { 0%, 100% { opacity: 0.7; } 50% { opacity: 0.2; } }
    @keyframes fl-pulse-2 { 0%, 100% { opacity: 0.5; } 50% { opacity: 0.1; } }
    @keyframes fl-pulse-3 { 0%, 100% { opacity: 0.35; } 50% { opacity: 0.08; } }
    @keyframes fl-spin-cw { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
    @keyframes fl-spin-ccw { from { transform: rotate(360deg); } to { transform: rotate(0deg); } }
    @media (prefers-reduced-motion: reduce) {
      .fl-speed-1, .fl-speed-2, .fl-speed-3, .fl-orbit-1, .fl-orbit-2 { animation: none !important; }
    }
  </style>
  <defs>
    <linearGradient id="mark" x1="20" y1="20" x2="108" y2="108" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="40%" stop-color="#a855f7"/>
      <stop offset="70%" stop-color="#d946ef"/>
      <stop offset="100%" stop-color="#f97316"/>
    </linearGradient>
    <linearGradient id="glow" x1="64" y1="10" x2="64" y2="118" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#f97316" stop-opacity="0.03"/>
    </linearGradient>
    <linearGradient id="inner-glow" x1="40" y1="30" x2="90" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.12"/>
      <stop offset="50%" stop-color="#d946ef" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#f97316" stop-opacity="0.02"/>
    </linearGradient>
    <clipPath id="frame">
      <path d="M28 16 L100 16 L112 40 L112 88 L100 112 L28 112 L16 88 L16 40 Z"/>
    </clipPath>
  </defs>

  <!-- Octagonal frame — engine block feel -->
  <path d="M28 16 L100 16 L112 40 L112 88 L100 112 L28 112 L16 88 L16 40 Z"
        fill="url(#glow)" stroke="url(#mark)" stroke-width="1.2" stroke-linejoin="round"/>

  <!-- Inner octagon echo -->
  <path d="M34 26 L98 26 L106 44 L106 84 L98 102 L34 102 L22 84 L22 44 Z"
        fill="none" stroke="url(#mark)" stroke-width="0.4" opacity="0.15" stroke-linejoin="round"/>

  <g clip-path="url(#frame)">
    <!-- Core glow -->
    <circle cx="64" cy="64" r="36" fill="url(#inner-glow)"/>

    <!-- Turbine blades (3) — suggest rotation and power -->
    <path d="M64 24 L70 56 L58 56 Z" fill="url(#mark)" opacity="0.9"/>
    <path d="M92 52 L62 58 L66 46 Z" fill="url(#mark)" opacity="0.7"/>
    <path d="M36 80 L62 66 L58 78 Z" fill="url(#mark)" opacity="0.5"/>

    <!-- Central F — the mark -->
    <path d="M44 38h40v9H55v12h22v9H55v22h-11V38z" fill="url(#mark)"/>

    <!-- Speed lines (CSS animations, respects prefers-reduced-motion) -->
    <line class="fl-speed-1" x1="86" y1="38" x2="96" y2="32" stroke="#f97316" stroke-width="1.8" stroke-linecap="round" opacity="0.7"/>
    <line class="fl-speed-2" x1="92" y1="50" x2="104" y2="48" stroke="#d946ef" stroke-width="1.3" stroke-linecap="round" opacity="0.5"/>
    <line class="fl-speed-3" x1="90" y1="62" x2="100" y2="64" stroke="#a855f7" stroke-width="1" stroke-linecap="round" opacity="0.35"/>

    <!-- Orbital ring (CSS animations, respects prefers-reduced-motion) -->
    <circle class="fl-orbit-1" cx="64" cy="64" r="48" fill="none" stroke="url(#mark)" stroke-width="0.5"
            stroke-dasharray="3 12" opacity="0.2"/>
    <circle class="fl-orbit-2" cx="64" cy="64" r="38" fill="none" stroke="url(#mark)" stroke-width="0.35"
            stroke-dasharray="2 18" opacity="0.12"/>
  </g>

  <!-- Corner accents -->
  <circle cx="28" cy="16" r="1.5" fill="#a855f7" opacity="0.6"/>
  <circle cx="100" cy="16" r="1.5" fill="#d946ef" opacity="0.5"/>
  <circle cx="112" cy="40" r="1" fill="#d946ef" opacity="0.4"/>
  <circle cx="112" cy="88" r="1" fill="#f97316" opacity="0.4"/>
  <circle cx="100" cy="112" r="1.5" fill="#f97316" opacity="0.5"/>
  <circle cx="28" cy="112" r="1.5" fill="#f97316" opacity="0.4"/>
  <circle cx="16" cy="88" r="1" fill="#a855f7" opacity="0.4"/>
  <circle cx="16" cy="40" r="1" fill="#a855f7" opacity="0.5"/>
</svg>
